{% extends "base.html" %}
{% block judul %}{{ judul }} — Edu Coffee{% endblock %}
{% block isi %}
<h1>{{ judul }}</h1>
{% for g_ in galat %}
  <p class="galat" role="alert">{{ g_ }}</p>
{% endfor %}
<form method="post">
  <label>Nama
    <input type="text" name="nama" value="{{ barang.get('nama', '') }}" required maxlength="100">
  </label>
  <label>Harga jual (Rp)
    <input type="number" name="harga_jual" value="{{ barang.get('harga_jual', '') }}" required min="0" step="1">
  </label>
  {% if dengan_stok %}
  <label>Stok awal
    <input type="number" name="stok" value="{{ barang.get('stok', 0) }}" required min="0" step="1">
  </label>
  {% endif %}
  <label>Stok minimum
    <input type="number" name="stok_minimum" value="{{ barang.get('stok_minimum', 0) }}" required min="0" step="1">
  </label>
  <button type="submit">Simpan</button>
  <a href="{{ url_for('daftar_barang') }}">Batal</a>
</form>
{% endblock %}
