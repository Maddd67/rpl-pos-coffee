<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block judul %}Edu Coffee{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <strong>Edu Coffee</strong>
    {% if g.pengguna %}
      <a href="{{ url_for('daftar_barang') }}">Katalog &amp; Stok</a>
      {% if g.pengguna['peran'] == 'pemilik' %}
        <a href="{{ url_for('daftar_masuk') }}">Barang masuk</a>
      {% endif %}
      <span class="kanan">
        {{ g.pengguna['username'] }} ({{ g.pengguna['peran'] }})
        <form class="baris" method="post" action="{{ url_for('logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit">Keluar</button>
        </form>
      </span>
    {% endif %}
  </nav>
  <main>
    {% for pesan in get_flashed_messages() %}
      <p class="pesan" role="status">{{ pesan }}</p>
    {% endfor %}
    {% block isi %}{% endblock %}
  </main>
</body>
</html>
